<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thư viện nghề nghiệp — AXIS</title>
    <link rel="stylesheet" href="../css/global.css" />
    <script src="../js/axis-brand.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
      <script src="../js/icons.js" defer></script>
      <script src="../js/components.js?v=mobile-nav-2" defer></script>
</head>
  <body>
    <div class="page-shell">
      

      <div class="workspace">
        <app-header class="topbar"></app-header>

        <main class="main-column">
          <section class="page-hero">
            <span class="eyebrow">Thư viện nghề nghiệp</span>
            <h1>Khám phá thế giới nghề nghiệp.</h1>
            <p class="lead">Tìm hiểu nghề, kỹ năng cần có và so sánh các lựa chọn.</p>
          </section>

          <div class="filter-row">
            <input id="careerSearch" type="search" placeholder="⌕ Tìm kiếm ngành nghề..." />
            <button class="primary-btn" id="careerSearchBtn" type="button">Khám phá</button>
          </div>

          <section class="career-grid" id="careerCards" aria-live="polite">
            <p class="form-help">Đang tải các nhóm ngành…</p>
          </section>
        </main>
      </div>
    </div>

    <app-footer class="site-footer"></app-footer>

    <div class="settings-modal hidden" id="settingsModal" aria-hidden="true">
      <div class="settings-modal-backdrop" data-close-settings="true"></div>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-header">
          <h3 id="settingsTitle">Cài đặt tài khoản</h3>
          <button type="button" class="settings-close" id="closeSettingsModal" aria-label="Đóng cài đặt">×</button>
        </div>
        <div class="settings-list">
          <label class="setting-item"><span>Thông báo email</span><input type="checkbox" checked /></label>
          <label class="setting-item"><span>Gợi ý nghề nghiệp tự động</span><input type="checkbox" checked /></label>
          <label class="setting-item"><span>Bảo mật 2 lớp</span><input type="checkbox" /></label>
          <label class="setting-item"><span>Chế độ tối</span><input type="checkbox" /></label>
        </div>
        <div class="settings-actions">
          <button type="button" class="ghost-btn" data-close-settings="true">Hủy</button>
          <button type="button" class="primary-btn" id="saveSettings">Lưu thay đổi</button>
        </div>
      </div>
    </div>

    <script>
      (function(){
        const authArea = document.getElementById('authArea');
        const userPanel = document.getElementById('userPanel');
        const userChip = document.getElementById('userChip');
        const userMenu = document.getElementById('userMenu');
        const menuButtons = document.querySelectorAll('[data-menu-action]');

        const setSignedIn = (opts) => {
          if (authArea) authArea.classList.add('hidden');
          if (userPanel) userPanel.classList.remove('hidden');
          if (userMenu) userMenu.classList.add('hidden');
          if (userChip) userChip.setAttribute('aria-expanded', 'false');
        };

        const setSignedOut = (opts) => {
          if (authArea) authArea.classList.remove('hidden');
          if (userPanel) userPanel.classList.add('hidden');
          if (userMenu) userMenu.classList.add('hidden');
          if (userChip) userChip.setAttribute('aria-expanded', 'false');
        };


        if (userChip) {
          userChip.addEventListener('click', function () {
            if (!userMenu) return;
            const isHidden = userMenu.classList.contains('hidden');
            userMenu.classList.toggle('hidden', !isHidden);
            userChip.setAttribute('aria-expanded', String(isHidden));
          });
        }

        menuButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            const action = button.getAttribute('data-menu-action');
            if (action === 'settings') {
              const modal = document.getElementById('settingsModal');
              if (modal) modal.classList.remove('hidden');
            } else if (action === 'logout') {
              setSignedOut();
            } else {
              alert('Tính năng chưa được triển khai trong phiên bản demo.');
            }
            if (userMenu) userMenu.classList.add('hidden');
            if (userChip) userChip.setAttribute('aria-expanded', 'false');
          });
        });

        const modal = document.getElementById('settingsModal');
        const closeModal = document.getElementById('closeSettingsModal');
        const saveSettings = document.getElementById('saveSettings');
        const closeTriggers = document.querySelectorAll('[data-close-settings="true"]');

        closeModal && closeModal.addEventListener('click', function () { modal && modal.classList.add('hidden'); });
        closeTriggers.forEach(function (trigger) { trigger.addEventListener('click', function () { modal && modal.classList.add('hidden'); }); });
        saveSettings && saveSettings.addEventListener('click', function () { alert('Cài đặt đã được lưu thành công.'); modal && modal.classList.add('hidden'); });

        document.addEventListener('click', function (event) {
          if (!userMenu || !userChip) return;
          if (!userMenu.contains(event.target) && !userChip.contains(event.target)) {
            userMenu.classList.add('hidden');
            userChip.setAttribute('aria-expanded', 'false');
          }
        });
      })();

      (function(){
        // Header-nav is now the single source of truth. Attach safe click handlers to header nav items.
        const headerNav = document.querySelector('.header-nav');
        if (!headerNav) return;
        const navLinks = headerNav.querySelectorAll('.nav-item');

        navLinks.forEach(function (link) {
          link.addEventListener('click', function (e) {
            // Toggle active state
            navLinks.forEach(function (l){ l.classList.remove('active'); });
            link.classList.add('active');

            // Close user menu if open
            const userMenu = document.getElementById('userMenu');
            const userChip = document.getElementById('userChip');
            if (userMenu) userMenu.classList.add('hidden');
            if (userChip) userChip.setAttribute('aria-expanded','false');
          });
        });

        headerNav.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            const item = e.target.closest('.nav-item');
            if (item) { item.click(); e.preventDefault(); }
          }
        });
      })();

      (function(){
        const catalog = document.getElementById('careerCatalog');
        const careerCardsRoot = document.getElementById('careerCards');
        const careerSearch = document.getElementById('careerSearch');
        const careerSearchBtn = document.getElementById('careerSearchBtn');
        let catalogItems = [];
        const descriptions = {
          N01: ['Phát triển hệ thống số, phần mềm và hạ tầng công nghệ cho doanh nghiệp.', 'Người học thường bắt đầu từ lập trình, cơ sở dữ liệu và tư duy giải quyết vấn đề; sau đó có thể đi theo web, mobile, cloud, an toàn thông tin hoặc dữ liệu.'],
          N02: ['Tổ chức nguồn lực, vận hành doanh nghiệp và xây dựng chiến lược tăng trưởng.', 'Ngành kết hợp kinh tế, con người và dữ liệu để trả lời doanh nghiệp nên làm gì, làm với ai và đo hiệu quả ra sao.'],
          N03: ['Chăm sóc sức khỏe, nghiên cứu y sinh và phát triển giải pháp điều trị.', 'Sinh học là nền tảng ưu tiên để hiểu cơ thể và bệnh học; Hóa học hỗ trợ thuốc, xét nghiệm và quy trình chuyên môn.'],
          N04: ['Sử dụng ngôn ngữ, văn hóa và giao tiếp đa ngữ trong giáo dục và kinh doanh.', 'Cơ hội mở rộng từ biên phiên dịch, giáo dục, nội dung số đến quan hệ đối ngoại và làm việc trong môi trường quốc tế.'],
          N05: ['Biến ý tưởng thị giác thành sản phẩm nghệ thuật, thương hiệu và trải nghiệm.', 'Ngoài năng khiếu thẩm mỹ, người học cần luyện quan sát, kể chuyện bằng hình ảnh và xây dựng portfolio qua dự án thực tế.'],
          N06: ['Thiết kế, vận hành và tự động hóa máy móc, dây chuyền và hệ thống kỹ thuật.', 'Đây là nhóm ngành giao giữa Toán, Vật lí và công nghệ; sản phẩm đầu ra có thể là robot, thiết bị, dây chuyền hoặc hệ thống điều khiển.'],
          N07: ['Quy hoạch không gian, thiết kế công trình và quản lý quá trình thi công.', 'Công việc đòi hỏi tư duy không gian, kỹ thuật, khả năng phối hợp nhiều bên và trách nhiệm với chất lượng, an toàn công trình.'],
          N08: ['Phân tích quy định, bảo vệ quyền lợi và giữ gìn an ninh, trật tự xã hội.', 'Người học rèn đọc hiểu văn bản, lập luận, đạo đức nghề nghiệp và khả năng xử lý tình huống theo quy định.'],
          N09: ['Thiết kế hoạt động học tập, hỗ trợ người học và phát triển cộng đồng giáo dục.', 'Không chỉ là truyền đạt kiến thức, ngành còn cần tâm lý học, thiết kế bài học, đánh giá tiến bộ và giao tiếp với gia đình.'],
          N10: ['Tạo ra trải nghiệm dịch vụ, lưu trú, ẩm thực và du lịch đáng nhớ.', 'Môi trường làm việc năng động, coi trọng ngoại ngữ, kỹ năng phục vụ, vận hành và khả năng xử lý tình huống với khách hàng.'],
          N11: ['Nghiên cứu công chúng, kể chuyện thương hiệu và truyền tải thông tin hiệu quả.', 'Người học kết hợp viết, hình ảnh, dữ liệu và nền tảng số để tạo nội dung có mục tiêu và đo được phản hồi.'],
          N12: ['Phân tích dòng tiền, rủi ro và các quyết định tài chính của cá nhân, tổ chức.', 'Nền tảng Toán, kinh tế và sự cẩn trọng giúp người học đọc báo cáo, xây mô hình và hỗ trợ quyết định đầu tư hoặc quản trị.'],
          N13: ['Giải quyết bài toán môi trường, tài nguyên và phát triển bền vững.', 'Ngành theo dõi chất lượng môi trường, đánh giá tác động và thiết kế giải pháp giảm phát thải, tiết kiệm tài nguyên.'],
          N14: ['Nghiên cứu tế bào, thuốc, sinh phẩm và quy trình công nghệ sinh học.', 'Phù hợp với học sinh yêu thích phòng thí nghiệm, Sinh học và nghiên cứu; đầu ra gắn với dược, y sinh, thực phẩm và sản xuất.'],
          N15: ['Nghiên cứu vật chất, phản ứng và vật liệu phục vụ sản xuất công nghiệp.', 'Hóa học được kết hợp với Vật lí, kỹ thuật và kiểm nghiệm để tạo ra vật liệu an toàn, bền hơn hoặc có tính năng mới.'],
          N16: ['Ứng dụng khoa học vào nông nghiệp, lâm nghiệp và nuôi trồng thủy sản.', 'Công nghệ cảm biến, sinh học và dữ liệu đang giúp nhóm ngành nâng năng suất, thích ứng khí hậu và bảo vệ hệ sinh thái.'],
          N17: ['Nghiên cứu con người, xã hội, lịch sử và các chuyển biến văn hóa.', 'Người học phát triển năng lực đọc, phỏng vấn, phân tích tư liệu và nhìn nhận vấn đề xã hội từ nhiều góc độ.'],
          N18: ['Kết nối các quốc gia, tổ chức và cộng đồng trong môi trường đa văn hóa.', 'Ngoại ngữ, kiến thức khu vực, đàm phán và khả năng viết giúp người học làm việc trong đối ngoại, hợp tác và tổ chức quốc tế.'],
          N19: ['Tối ưu dòng hàng hóa, kho vận và mạng lưới cung ứng.', 'Ngành dùng dữ liệu, quy trình và kỹ năng phối hợp để giảm thời gian, chi phí và rủi ro từ nhà cung cấp đến khách hàng.'],
          N20: ['Vận hành, điều phối và bảo đảm an toàn trong lĩnh vực hàng không, hàng hải.', 'Đề cao kỷ luật, ngoại ngữ, kỹ thuật, sức khỏe và khả năng xử lý tình huống trong môi trường có tiêu chuẩn an toàn cao.'],
          N21: ['Mô hình hóa, suy luận định lượng và khai thác dữ liệu để giải quyết vấn đề.', 'Toán, xác suất, lập trình và tư duy phản biện là nền tảng để xây mô hình, phân tích dữ liệu và truyền đạt kết quả.'],
          N22: ['Khám phá các quy luật vật lý, không gian và công nghệ đo lường.', 'Người học có thể đi từ nghiên cứu cơ bản đến mô phỏng, thiết bị đo, năng lượng, viễn thông hoặc các ứng dụng không gian.'],
          N23: ['Phát triển thành tích thể thao, sức khỏe thể chất và hoạt động thi đấu.', 'Bên cạnh luyện tập, ngành còn có hướng huấn luyện, quản lý sự kiện, khoa học thể thao và truyền thông thể thao.'],
          N24: ['Thiết kế chính sách, quản trị công và các chương trình hỗ trợ xã hội.', 'Người học quan tâm tới cộng đồng, pháp luật, dữ liệu xã hội và cách biến nhu cầu thực tế thành chương trình có tác động.']
        };
        const icons = ['◈', '◎', '⚗', '文', '✦', '⌘', '⌂', '§', '∿', '✈', '◌', '₫'];
        function escapeHtml(value) {
          return String(value || '').replace(/[&<>"']/g, function (character) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character];
          });
        }
        function renderCareerCards(items) {
          if (!careerCardsRoot) return;
          const coverImages = {
            N01: '../assets/hero-1.png',
            N02: '../assets/hero-2.png',
            N03: '../assets/hero-3.png',
            N04: '../assets/hero-4.png',
            N05: '../assets/hero-5.png',
            N06: '../assets/hero-6.png',
            N07: '../assets/hero-1.png',
            N08: '../assets/hero-2.png',
            N09: '../assets/hero-3.png',
            N10: '../assets/hero-4.png',
            N11: '../assets/hero-5.png',
            N12: '../assets/hero-6.png',
            N13: '../assets/hero-1.png',
            N14: '../assets/hero-2.png',
            N15: '../assets/hero-3.png',
            N16: '../assets/hero-4.png',
            N17: '../assets/hero-5.png',
            N18: '../assets/hero-6.png',
            N19: '../assets/hero-1.png',
            N20: '../assets/hero-2.png',
            N21: '../assets/hero-3.png',
            N22: '../assets/hero-4.png',
            N23: '../assets/hero-5.png',
            N24: '../assets/hero-6.png'
          };
          careerCardsRoot.innerHTML = items.map(function (item, index) {
            const skills = (item.subjects || []).concat(item.riasec || []).slice(0, 3);
            const priority = item.code === 'N03' ? ' career-card--priority' : '';
            const coverImage = coverImages[item.code];
            const cover = coverImage ? '<div class="career-card-cover" style="background-image:url(' + coverImage + ')"><span>' + escapeHtml(item.code) + '</span></div>' : '';
            return '<article class="career-card' + priority + '" data-career-code="' + escapeHtml(item.code) + '" data-skills="' + escapeHtml(skills.join(',')) + '">' +
              cover +
              '<div class="career-icon">' + icons[index % icons.length] + '</div>' +
              '<span class="eyebrow">' + escapeHtml(item.code) + '</span>' +
              '<h3>' + escapeHtml(item.name) + '</h3>' +
              '<p>' + escapeHtml((descriptions[item.code] || ['Khám phá kiến thức, kỹ năng và cơ hội phát triển trong nhóm ngành này.', 'Tìm hiểu chương trình đào tạo, thử một dự án nhỏ và đối chiếu với hồ sơ năng lực của bạn.'])[0]) + '</p>' +
              '<p class="career-card-detail">' + escapeHtml((descriptions[item.code] || ['', 'Tìm hiểu chương trình đào tạo, thử một dự án nhỏ và đối chiếu với hồ sơ năng lực của bạn.'])[1]) + '</p>' +
              '<div class="skill-row">' + skills.map(function (skill, skillIndex) { return '<small class="skill-pill ' + (skillIndex === 1 ? 'pill-indigo' : 'pill-teal') + '">' + escapeHtml(skill) + '</small>'; }).join('') +
              '<span class="career-score">AXIS catalog</span></div>' +
              '<div class="career-card-actions"><button class="ghost-btn add-to-plan" type="button">Thêm vào lộ trình</button><a href="career-detail.html?career=' + encodeURIComponent(item.name) + '" class="ghost-btn">Xem chi tiết</a></div></article>';
          }).join('');
          bindCareerCards();
        }
        function bindCareerCards() {
          careerCardsRoot.querySelectorAll('.career-card').forEach(function (card) {
            const btn = card.querySelector('.add-to-plan');
            if (btn) btn.addEventListener('click', function () {
              addCareerToPlan(card.querySelector('h3').textContent.trim(), card.getAttribute('data-skills') || '');
            });
          });
        }
        let goalsCache = [];
        function loadGoals(){ return goalsCache; }
        function saveGoals(g){
          if (window.AXISAuth && window.AXISAuth.isSignedIn()) {
            const payload = g.map(function (goal) {
              return {
                title: goal.title,
                target_date: goal.date || null,
                status: goal.done ? 'completed' : 'pending',
                minutes_per_day: Number(goal.minutes) || null,
                note: goal.note || '',
                category: goal.category || 'career'
              };
            });
            return window.AXISAuth.accountRequest('/goals', { method: 'PUT', body: JSON.stringify(payload) })
              .then(function (saved) {
                goalsCache = saved.map(function (goal) {
                  return Object.assign({}, goal, {
                    date: goal.target_date || '',
                    minutes: goal.minutes_per_day || '',
                    done: goal.status === 'completed'
                  });
                });
                return saved;
              });
          }
          return Promise.reject(new Error('Vui lòng đăng nhập để lưu kế hoạch.'));
        }

        async function addCareerToPlan(title, skills){
          const goals = loadGoals();
          const goalTitle = `Tìm hiểu nghề: ${title}`;
          const note = skills ? `Kỹ năng gợi ý: ${skills}` : '';
          goals.push({ title: goalTitle, when: '', note: note, category: 'career', done: false, created: Date.now() });
          try {
            await saveGoals(goals);
            alert('Đã thêm vào lộ trình của bạn — vào trang Phát triển bản thân để xem và chỉnh sửa.');
          } catch (error) {
            alert(error.message || 'Không thể lưu kế hoạch.');
          }
        }

        window.FuturePathAuth.fetchWithTimeout('/api/v1/axis/benchmarks', {}, 8000).then(function (response) { return response.ok ? response.json() : []; }).then(function (items) {
          if (!Array.isArray(items) || !items.length) throw new Error('empty catalog');
          catalogItems = items;
          if (catalog) catalog.innerHTML = items.map(function (item) {
            return '<a class="career-catalog-item" href="career-detail.html?career=' + encodeURIComponent(item.name) + '"><strong>' + escapeHtml(item.code) + '</strong><span>' + escapeHtml(item.name) + '</span></a>';
          }).join('');
          renderCareerCards(items);
        }).catch(function () {
          if (catalog) catalog.innerHTML = '<span class="form-help">Danh mục tạm thời chưa khả dụng.</span>';
          if (careerCardsRoot) careerCardsRoot.innerHTML = '<p class="form-help">Không thể tải danh mục ngành lúc này.</p>';
        });
        function filterCards() {
          const query = String(careerSearch && careerSearch.value || '').trim().toLowerCase();
          renderCareerCards(catalogItems.filter(function (item) {
            return !query || (item.code + ' ' + item.name).toLowerCase().indexOf(query) !== -1;
          }));
        }
        if (careerSearch) careerSearch.addEventListener('input', filterCards);
        if (careerSearchBtn) careerSearchBtn.addEventListener('click', filterCards);
        document.addEventListener('futurepath:auth-state', function (event) {
          if (!event.detail.signedIn) {
            goalsCache = [];
            return;
          }
          window.AXISAuth.accountRequest('/goals').then(function (goals) {
            goalsCache = goals.map(function (goal) {
              return Object.assign({}, goal, {
                date: goal.target_date || '',
                minutes: goal.minutes_per_day || '',
                done: goal.status === 'completed'
              });
            });
          }).catch(function (error) {
            alert(error.message || 'Không thể tải kế hoạch tài khoản.');
          });
        });
      })();
    </script>
  <script>

</script>
</body>
</html>
