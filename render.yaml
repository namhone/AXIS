services:
  - type: web
    name: axis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Run migrations separately (Render pre-deploy or manually). Start the app only.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Run alembic migrations before starting the app. Render runs this command from the service rootDir (backend).
    preDeployCommand: alembic -c alembic.ini upgrade head
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  - type: web
    name: axis-auth-service
    runtime: node
    rootDir: node-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: COOKIE_NAME
        value: axis_refresh_token
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
